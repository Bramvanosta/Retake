# yaml-language-server: $schema=../../../packages/core/schema/sandbox.schema.json
# The fixture product as a sandbox (L1.8, provider process): Retake starts the Northfield server on ports of its
# own (4501–4504, so it never meets a fixture you started by hand on 4401–4404), seeds it before every take with the
# fixture's own reset API, and films the signed-in side as the supplier and the buyer.
#
#   retake sandbox up northfield-fixture                     # start + seed (status / logs / reset / down likewise)
#   retake run northfield-fixture sandbox-quote --sandbox    # up if needed, health, reset to the seed, capture
version: 1
provider: process
services:
  fixture:
    # "node" runs Retake's own Node. Its in-memory data restarts with the process.
    command: [node, server.mjs, --console-port, "4501", --shop-port, "4502", --auth-console-port, "4503", --auth-shop-port, "4504"]
    cwd: ../../../fixtures/wholesale
    url: http://localhost:4501          # the open console: its health API (the pages below are behind a sign-in)
    health: /api/health
    pages:
      console: {url: http://localhost:4503, display: console.northfield.example}
      shop: {url: http://localhost:4504, display: shop.northfield.example}
# The seed: the fixture's reset API (seed data back, demo clock restarted at 2 Nov 2026 10:24, mailbox emptied).
seed:
  - name: reset-fixture
    http: {method: POST, url: "{{console}}/api/reset"}
# The fixture's Mailpit-compatible test mailbox (emptied at every reset).
mailbox: {provider: mailpit, url: http://localhost:4501/mailbox}
# The fixture's invented demo accounts (fixtures/wholesale/README.md): signed in off camera by their login steps.
login_url: /sign-in
accounts:
  supplier:
    pages: [console]
    username: maja@northfield.example
    password: roast-lot-2026
    check: {url: "console:/products", expect_text: Maja Lindqvist}
    login:
      - open: "console:/sign-in"
      - type: {into: {label: Email}, text: "{{account.username}}"}
      - type: {into: {label: Password}, text: "{{account.password}}"}
      - click: {role: button, name: Sign in}
      - wait_for: {text: Maja Lindqvist}
  buyer:
    pages: [shop]
    username: orders@demo-cafe.example
    password: filter-bloom-2026
    check: {url: "shop:/", expect_text: Demo Café}
    login:
      - open: "shop:/sign-in"
      - type: {into: {label: Email}, text: "{{account.username}}"}
      - type: {into: {label: Password}, text: "{{account.password}}"}
      - click: {role: button, name: Sign in}
      - wait_for: {text: Demo Café}
