# yaml-language-server: $schema=../../../packages/core/schema/scenario.schema.json
# Buyer side on a phone: the shop at 390 × 844 (responsive layout). Captured at 1×: the phone screen of the layout
# shows it at about its own size in a 1080p video (new-headless screencasts stay at CSS size at scale 2, see HANDOFF).
# Framed with the phone layout (studio/layout-phone): the capture aspect sizes the device screen.
video: mobile-quote
title: {kicker: On the go, text: Request a quote from your phone}
outro: {tagline: "Quotes from anywhere, in a minute."}
capture: {width: 390, height: 844, scale: 1}
frame: phone

setup:
  - name: reset
    http: {method: POST, url: "{{shop}}/api/reset"}

teardown:
  - name: reset
    http: {method: POST, url: "{{shop}}/api/reset"}

scenes:
  - id: browse
    caption: {kicker: Discover, text: "Fresh arrivals, ready to order on the go."}
    page: shop
    open: /
    steps:
      - scroll: {to: {text: Fresh arrivals}, offset: -70, duration: 1.4}
      - click: Selowa Ridge
      - wait_for: {target: {role: button, name: Request a quote}}
      - hold: 1.0

  - id: request
    caption: {kicker: Request a quote, text: "Bags, grind and delivery window in a few taps."}
    steps:
      - click: {role: button, name: Request a quote}
      - click: {aria: Increase, in: dialog}
      - select: {field: Bag size, option: 5 kg}
      - select: {field: Grind, option: Whole bean}
      - click: {label: Delivery window}
      - click: {aria: Next month}
      - click: {aria: "14 December 2026"}
      - click: {aria: "23 December 2026"}
      - type: {into: {label: Message}, text: "Light roast, please.", cps: 16}
      - click: {text: Send request, in: dialog}
      - wait_for: {text: Quote request sent}
      - hold: 2.2
