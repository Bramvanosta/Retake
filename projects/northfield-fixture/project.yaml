# yaml-language-server: $schema=../../packages/core/schema/project.schema.json
# Demo Studio project filming the bundled fixture product (fixtures/wholesale).
# Start it first:  pnpm fixture   (or: node fixtures/wholesale/server.mjs)
name: Northfield (fixture)
# Each page: its real URL (what the runner opens) and the URL the video shows (`display`: browser bars, `{{shop}}` in a
# caption, notification apps) — invented hosts under the reserved .example domain, never localhost on screen.
environments:
  local:
    console: {url: http://localhost:4401, display: console.northfield.example}
    shop: {url: http://localhost:4402, display: shop.northfield.example}
  # The same apps behind a sign-in (the fixture serves them on :4403 / :4404): every scenario runs signed in with
  # `--env signed-in`, as the persona whose `pages` list each page (L1.6).
  signed-in:
    console: {url: http://localhost:4403, display: console.northfield.example}
    shop: {url: http://localhost:4404, display: shop.northfield.example}
  # Pretend production (L1.7): the local fixture, filmed read-only — the browser's writes to the fixture are stopped
  # or answered by a mock, hooks that write are refused (`studio run northfield-fixture quote --env production` is
  # refused before anything runs: its setup hooks write). The `read-only` scenario runs here.
  production:
    production: true
    pages:
      console: {url: http://localhost:4401, display: console.northfield.example}
      shop: {url: http://localhost:4402, display: shop.northfield.example}
    read_only:
      mocks:   # for every scenario on this environment: the shop marks its notifications read when the bell opens
        - {request: "POST shop:/api/notifications/read", json: {unread: 0, items: []}}
# Sandbox mode (L1.8): a disposable copy of the fixture that Demo Studio starts on ports of its own (4501–4504), seeds
# and resets before every take (`studio run northfield-fixture sandbox-quote --sandbox`; `studio sandbox up | status |
# logs | reset | down northfield-fixture`). Its pages, display URLs and accounts come from its sandbox.yaml.
# sandbox-docker: the same in Docker (4511–4514) with a real Mailpit (4525) — `--env sandbox-docker`.
sandboxes:
  sandbox: sandbox/sandbox.yaml
  sandbox-docker: sandbox/docker/sandbox.yaml
default_env: local
# Personas of the signed-in environment. Their sessions live in ~/.demo-studio (never in this file):
# `studio login northfield-fixture --env signed-in --persona supplier` signs one in; a run without a valid session signs
# in automatically, off camera, with the `login` steps (the passwords come from the environment: see
# fixtures/wholesale/README.md).
auth:
  signed-in:
    login_url: /sign-in
    personas:
      supplier:
        pages: [console]
        check: {url: "console:/products", expect_text: Maja Lindqvist}
        login:
          - open: "console:/sign-in"
          - type: {into: {label: Email}, text: maja@northfield.example}
          - type: {into: {label: Password}, text: "{{env:NORTHFIELD_SUPPLIER_PASSWORD}}"}
          - click: {role: button, name: Sign in}
          - wait_for: {text: Maja Lindqvist}
      buyer:
        pages: [shop]
        check: {url: "shop:/", expect_text: Demo Café}
        login:
          - open: "shop:/sign-in"
          - type: {into: {label: Email}, text: orders@demo-cafe.example}
          - type: {into: {label: Password}, text: "{{env:NORTHFIELD_BUYER_PASSWORD}}"}
          - click: {role: button, name: Sign in}
          - wait_for: {text: Demo Café}
capture: {width: 1920, height: 1080, scale: 1, fps: 30}
frame: card
template: editorial
locale: en
# Test mailbox read by wait_for_email: the fixture serves a Mailpit-compatible API (a real Mailpit works the same way).
mailbox: {provider: mailpit, url: "http://localhost:4401/mailbox"}
reset:
  - name: reset-fixture
    http: {method: POST, url: "{{console}}/api/reset"}
