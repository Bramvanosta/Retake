# yaml-language-server: $schema=../../schema/component.schema.json
# Caption scaffold: the active cue as an accent-ruled kicker over one display line, rising in at each cue change.
# Drawn in the layout's caption area (props.area) or as a band near the bottom of the frame; styles come from the
# theme's caption text styles.
id: scaffolds/caption
version: 0.1.0
kind: caption
name: Caption
description: Kicker with a short accent rule over a display line, in the layout caption area; each cue rises in and fades out.
slots:
  text: {type: text, default_from: scene.caption.text, max_chars: 90, description: Caption line (when no cues are given).}
  kicker: {type: text, default_from: scene.caption.kicker, max_chars: 40, description: Small line above the caption.}
params:
  type: object
  properties:
    align: {type: string, enum: [center, left], default: center, description: Alignment in the caption area.}
    max_lines: {type: integer, minimum: 1, maximum: 3, default: 2, description: Lines before the text shrinks.}
    rule: {type: boolean, default: true, description: Short accent rule before the kicker.}
tokens: [colors.accent, colors.text, fonts.display, fonts.body, captions.kicker, captions.line]
variants: [landscape, vertical]
preview:
  slots: {text: Pick a customer and the price list follows., kicker: Quotes}
  at: [0.6]
