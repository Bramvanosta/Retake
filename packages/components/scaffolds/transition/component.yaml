# yaml-language-server: $schema=../../schema/component.schema.json
# Transition scaffold: a crossfade, or a dip through a theme colour. The component renders twice: around the outgoing
# segment (direction: exiting) and around the incoming one (direction: entering, on top); progress = frame /
# durationInFrames. A crossfade overlaps the two segments (both renders see frames [0, n)); a dip does not: the
# exiting render covers frames [0, ⌊n/2⌋) and the entering one [⌊n/2⌋, n).
id: scaffolds/transition
version: 0.1.0
kind: transition
name: Transition
description: Crossfade between two segments, or a dip through the theme paper, text or accent colour.
slots:
  screen: {type: screen, required: true, description: The segment this render wraps.}
params:
  type: object
  properties:
    through: {type: string, enum: [none, paper, text, accent], default: none, description: Colour to dip through (none = crossfade).}
tokens: [colors.paper, colors.text, colors.accent]
duration: {default: 0.4, min: 0.1, max: 2}
variants: [landscape, vertical]
preview:
  at: [0.2]
