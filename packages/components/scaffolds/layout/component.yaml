# yaml-language-server: $schema=../../schema/component.schema.json
# Layout scaffold: the capture in a rounded card with a soft shadow on the theme background, the caption area below
# and the brand mark in a corner (the composition draws the caption component and the brand mark in the `caption`
# and `brandmark` rects). The geometry below is what the planner and the review use: keep index.tsx in sync.
id: scaffolds/layout
version: 0.1.0
kind: layout
name: Layout
description: Capture in a rounded card with a soft shadow on the theme background, caption area below, brand mark in a corner.
slots:
  screen: {type: screen, required: true, description: The capture (video + camera moves).}
params:
  type: object
  properties:
    radius: {type: number, minimum: 0, maximum: 64, default: 18, description: Corner radius of the card in design px.}
    shadow: {type: string, enum: [none, soft, strong], default: soft, description: Shadow under the card.}
tokens: [colors.text, colors.paper, background]
geometry:
  screen: {x: 180, y: 54, w: 1560, h: 878}
  caption: {x: 180, y: 952, w: 1560, h: 104}
  brandmark: {x: 1810, y: 1020, w: 80, h: 30}
  radius: 18
# Vertical (1080×1920) and square (1080×1080): a screen rect with another aspect than the capture REFRAMES it — the
# planner shows the region of the capture with the screen's aspect and moves it with the cursor and the targets. Write
# the values as expressions over `aspect` (the capture's) to show narrow captures whole (see studio/layout-card).
geometry_vertical:
  screen: {x: 40, y: 224, w: 1000, h: 1240}
  caption: {x: 40, y: 1476, w: 1000, h: 220}
  brandmark: {x: 960, y: 1840, w: 80, h: 40}
  radius: 18
geometry_square:
  screen: {x: 40, y: 40, w: 1000, h: 750}
  caption: {x: 40, y: 802, w: 1000, h: 160}
  brandmark: {x: 960, y: 1010, w: 80, h: 40}
  radius: 18
variants: [landscape, vertical, square]
preview:
  at: [1]
