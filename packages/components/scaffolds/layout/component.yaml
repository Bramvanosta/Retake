# yaml-language-server: $schema=../../schema/component.schema.json
# Layout scaffold: the capture in a rounded card with a soft shadow on the theme background, the caption area below
# and the brand mark in a corner. The geometry below is what the planner and the review use: keep index.tsx in sync.
id: scaffolds/layout
version: 0.1.0
kind: layout
name: Layout
description: Capture in a rounded card with a soft shadow on the theme background, caption area below, brand mark in a corner.
slots:
  screen: {type: screen, required: true, description: The capture (video + camera moves).}
params:
  type: object
  properties:
    radius: {type: number, minimum: 0, maximum: 64, default: 18, description: Corner radius of the card in design px.}
    shadow: {type: string, enum: [none, soft, strong], default: soft, description: Shadow under the card.}
tokens: [colors.text, colors.paper, background, logo, brandmark]
geometry:
  screen: {x: 180, y: 54, w: 1560, h: 878}
  caption: {x: 180, y: 952, w: 1560, h: 104}
  brandmark: {x: 1810, y: 1020, w: 80, h: 30}
  radius: 18
geometry_vertical:
  screen: {x: 40, y: 600, w: 1000, h: 563}
  caption: {x: 40, y: 1203, w: 1000, h: 220}
  brandmark: {x: 960, y: 1840, w: 80, h: 40}
  radius: 18
variants: [landscape, vertical]
preview:
  at: [1]
