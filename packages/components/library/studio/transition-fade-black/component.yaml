# yaml-language-server: $schema=../../../schema/component.schema.json
# A dip between two segments: the outgoing one eases into the dip colour, the incoming one eases out of it (the
# composition renders the component around the end of the outgoing segment — direction exiting, frames [0, ⌊n/2⌋) —
# and around the start of the incoming one — entering, [⌊n/2⌋, n)); fully covered at the cut. `through` picks black or
# the theme's night tone; `color` (any CSS colour) overrides both. style_bias balanced / motion add a 1–2 % scale
# breath (out: shrinking a touch, in: settling from slightly larger).
id: studio/transition-fade-black
version: 1.0.0
kind: transition
name: Fade through black
description: The outgoing segment eases into black (or the theme's night tone), then the incoming one eases out of it; a slight scale breath with livelier themes.
tags: [transition, fade, black, dip]
slots:
  screen: {type: screen, required: true, description: The segment this render wraps.}
params:
  type: object
  properties:
    duration: {type: number, minimum: 0, maximum: 3, default: 0.4, description: Length of the whole dip (out + in) in seconds.}
    through: {type: string, enum: [black, night], default: black, description: "The dip colour: black, or the theme's night tone."}
    color: {type: string, description: "Any CSS colour for the dip (overrides `through`)."}
tokens: [colors.dark, colors.text, colors.paper, style_bias]
duration: {default: 0.4, min: 0.1, max: 3}
variants: [landscape, vertical]
preview:
  at: [0.07]
