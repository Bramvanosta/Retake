# yaml-language-server: $schema=../../../schema/component.schema.json
# PLACEHOLDER (L2.4): stand-in until the full version lands in L2.7.
# Dip to black: the composition renders it around the end of the outgoing segment (direction: exiting, the first half
# of the transition: fade to black) and around the start of the incoming one (direction: entering, the second half:
# fade from black); progress = frame / durationInFrames over the whole transition. The planner reads its length from
# `duration` and its kind (fade-black) from the id.
id: studio/transition-fade-black
version: 0.1.0
kind: transition
name: Fade through black
description: The outgoing segment fades to black, then the incoming one fades in from black.
tags: [placeholder, transition, fade, black]
slots:
  screen: {type: screen, required: true, description: The segment this render wraps.}
params:
  type: object
  properties:
    duration: {type: number, minimum: 0, maximum: 3, default: 0.4, description: Length of the whole dip (out + in) in seconds.}
    color: {type: string, default: "#000000", description: Colour of the dip (CSS).}
tokens: []
duration: {default: 0.4, min: 0.1, max: 3}
variants: [landscape, vertical]
preview:
  at: [0.1, 0.3]
