# yaml-language-server: $schema=../../../schema/component.schema.json
# Picture in picture (L2.11): the main page of a multi-page scene in the reference card (or a browser window when
# `chrome`), the other page floating over one of its corners — a phone drawn in CSS around a mobile page (metal band,
# glass bezel, rounded display), else a smaller card — both playing from the same source time. The planner chooses the
# corner so the inset never covers what the main page acts on now or next (it glides to another corner when it must),
# and, when the theme asks (`emphasis`: auto = style_bias balanced or motion), draws the inset larger while its page
# acts. Caption area below the card, brand mark at its bottom right (drawn by the composition).
# `screen` is the main page's capture area, `inset` the other page's at its default corner (bottom right); the
# planner mirrors it to the other corners with the same margins. Default (1920 × 1080 + 390 × 844 pages): screen
# {180, 40, 1560 × 878}, inset {1420, 267, 284 × 615}.
id: studio/layout-pip
version: 1.0.0
kind: layout
name: Picture in picture
description: The main page in a card (or browser window), the other page floating over a corner — a phone around a mobile page — never covering what the main page acts on; the inset may grow while its page acts.
tags: [multi-page, pip, phone]
slots:
  screen: {type: screen, required: true, description: The pages' captures (video + camera moves); the main page first.}
params:
  type: object
  properties:
    width: {type: number, minimum: 800, maximum: 1920, default: 1560, description: "Main card width in design px (landscape); its height follows the main page's aspect, at most 878 px."}
    radius: {type: number, minimum: 0, maximum: 64, default: 18, description: Corner radius of the main card in design px.}
    shadow: {type: string, enum: [none, soft, strong], default: soft, description: "Shadow under the main card (tinted with the theme's dark tone); the inset always has one."}
    chrome: {type: boolean, default: false, description: "A browser bar with the real URL above the main page (the planner turns it on for themes whose layout is a browser window)."}
    inset_height: {type: number, minimum: 0.3, maximum: 0.9, default: 0.7, description: "Height of a portrait inset (a phone) as a share of the main card's height."}
    inset_width: {type: number, minimum: 0.15, maximum: 0.5, default: 0.32, description: "Width of a landscape inset as a share of the main card's width."}
    margin: {type: number, minimum: 8, maximum: 120, default: 36, description: "Distance from the inset to the edges of the main card, in design px."}
    emphasis: {type: string, enum: [auto, none, grow], default: auto, description: "Draw the inset larger (×1.18) while its page acts: auto = for themes with style_bias balanced or motion."}
tokens: [colors.text, colors.paper, colors.dark, background]
geometry:
  vars:
    bar: chrome * 52
    h: min(round(width / aspect), 878 - bar)
    w: min(width, floor((878 - bar) * aspect))
    x: round((1920 - w) / 2)
    y: round((958 - bar - h) / 2) + bar
    ih: round(min(h * inset_height, w * inset_width / aspect2))
    iw: round(ih * aspect2)
  screen: {x: x, y: y, w: w, h: h}
  inset: {x: x + w - margin - iw, y: y + h - margin - ih, w: iw, h: ih}
  caption: {x: x, y: y + h + 12, w: w - 340, h: 110}
  brandmark: {x: x + w - 320, y: y + h + 47, w: 320, h: 40}
  radius: radius
# Vertical / square: the main card as tall as the format allows (a desktop page reframed to 4:5 / ≈ 4:3 around what it
# acts on), the inset over a corner.
geometry_vertical:
  vars:
    bar: chrome * 52
    a: min(aspect, 0.8)
    h: min(round(1000 / a), 1240 - bar)
    w: min(1000, round((1240 - bar) * a))
    x: round((1080 - w) / 2)
    y: round((1688 - bar - h) / 2) + bar
    ih: round(min(h * inset_height * 0.72, w * 0.42 / aspect2))
    iw: round(ih * aspect2)
  screen: {x: x, y: y, w: w, h: h}
  inset: {x: x + w - round(margin * 0.75) - iw, y: y + h - round(margin * 0.75) - ih, w: iw, h: ih}
  caption: {x: 40, y: y + h + 12, w: 1000, h: 220}
  brandmark: {x: 700, y: 1840, w: 340, h: 40}
  radius: radius
geometry_square:
  vars:
    bar: chrome * 52
    a: min(aspect, 1.32)
    h: min(round(1000 / a), 760 - bar)
    w: min(1000, round((760 - bar) * a))
    x: round((1080 - w) / 2)
    y: round((1000 - bar - h - 172) / 2) + bar
    ih: round(min(h * inset_height, w * 0.3 / aspect2))
    iw: round(ih * aspect2)
  screen: {x: x, y: y, w: w, h: h}
  inset: {x: x + w - round(margin * 0.75) - iw, y: y + h - round(margin * 0.75) - ih, w: iw, h: ih}
  caption: {x: 40, y: y + h + 12, w: 1000, h: 160}
  brandmark: {x: 700, y: 1010, w: 340, h: 40}
  radius: radius
variants: [landscape, vertical, square]
preview:
  at: [1]
  screens: [desktop, phone]
