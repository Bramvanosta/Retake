# yaml-language-server: $schema=../../../schema/component.schema.json
# The quiet outro, in the family of the reference outro (docs/reference/look.md "Outro"): the logo (110 px) and one
# closing line in the display font, centred by their bands; the logo fades in while scaling 0.94 → 1, the line follows
# 0.35 s later with a short rise — or, with `logo_only`, the logo and the wordmark on one row.
id: studio/outro-minimal
version: 1.0.0
kind: outro
name: Outro minimal
description: Logo and one closing line fading in on the theme background — or only the logo and wordmark (logo_only).
tags: [outro, minimal]
slots:
  tagline: {type: text, default_from: scenario.outro.tagline, max_chars: 70, description: One closing line.}
  logo: {type: image, default_from: theme.logo, description: Logo image (the theme logo by default).}
params:
  type: object
  properties:
    logo_only: {type: boolean, default: false, description: Show only the logo and the wordmark.}
tokens: [colors.text, colors.muted, background, fonts.display, logo, wordmark, style_bias]
duration: {default: 3, min: 1.2, max: 8}
variants: [landscape, vertical]
preview:
  slots: {tagline: Ready when you are.}
  at: [0.4, 2]
