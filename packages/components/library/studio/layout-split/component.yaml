# yaml-language-server: $schema=../../../schema/component.schema.json
# Two pages of a multi-page scene side by side (L2.11), filmed at the same time and played from the same source time:
# each page in a rounded card with the reference soft shadow (or a compact browser window with its real URL when
# `chrome`), its label above it (accent rule + kicker type; the acting page's label in the accent colour), the caption
# area below the pair, the brand mark (drawn by the composition) at the bottom right. Stacked top / bottom in the
# vertical format, side by side (narrow, reframed when a page is wider) in the square one. The idle page may be dimmed
# a little (`emphasis`: auto = for themes with style_bias balanced or motion).
# `panes` are the capture areas: the planner fits each page inside its pane (top-aligned) and, in vertical / square,
# reframes a page wider than its pane around what it acts on. Default (two 1440 × 900 pages): panes {48, 221, 896 × 560}
# and {976, 221, 896 × 560}, caption {48, 793, 1484 × 110}.
id: studio/layout-split
version: 1.0.0
kind: layout
name: Split screen
description: Two pages of a multi-page scene side by side (stacked in vertical), each in a card or a browser window with its label, playing from the same source time; the caption below.
tags: [multi-page, split]
slots:
  screen: {type: screen, required: true, description: "The pages' captures (video + camera moves), one per pane."}
params:
  type: object
  properties:
    margin: {type: number, minimum: 0, maximum: 200, default: 48, description: "Outer margin left and right of the pair, in design px (landscape)."}
    gap: {type: number, minimum: 0, maximum: 200, default: 32, description: "Gap between the two pages, in design px."}
    radius: {type: number, minimum: 0, maximum: 64, default: 14, description: Corner radius of each card in design px.}
    shadow: {type: string, enum: [none, soft, strong], default: soft, description: "Shadow under each card (tinted with the theme's dark tone)."}
    chrome: {type: boolean, default: false, description: "A compact browser bar above each page with its real URL (the planner turns it on for themes whose layout is a browser window)."}
    labels: {type: boolean, default: true, description: "Each page's label (scenario `pages.<id>.label`) above it."}
    emphasis: {type: string, enum: [auto, none, dim], default: auto, description: "Dim the idle page a little while the other acts: auto = for themes with style_bias balanced or motion."}
tokens: [colors.accent, colors.text, colors.muted, colors.paper, colors.dark, background, fonts.body]
geometry:
  vars:
    bar: chrome * 40                            # browser bar above each page
    lab: labels * 44                            # label row above each page
    W: (1920 - 2 * margin - gap) / 2
    room: 1080 - 40 - 12 - 110 - 20 - lab - bar
    h1: min(round(W / aspect), room)
    h2: min(round(W / aspect2), room)
    h: max(h1, h2)
    top: round((1080 - (lab + bar + h + 12 + 110)) / 2) + lab + bar
  screen: {x: margin, y: top, w: 2 * W + gap, h: h}
  panes:
    - {x: margin, y: top, w: W, h: h}
    - {x: margin + W + gap, y: top, w: W, h: h}
  caption: {x: margin, y: top + h + 12, w: 2 * W + gap - 340, h: 110}
  brandmark: {x: margin + 2 * W + gap - 320, y: top + h + 47, w: 320, h: 40}
  radius: radius
# Vertical: the pages stacked, each pane as tall as the format allows (a desktop page wider than its pane is reframed
# around what it acts on; a phone page shows whole, narrower).
geometry_vertical:
  vars:
    bar: chrome * 40
    lab: labels * 44
    room: round((1920 - 80 - 12 - 220 - 80 - gap - 2 * (lab + bar)) / 2)
    w1: min(1000, round(room * max(aspect, 0.42)))
    w2: min(1000, round(room * max(aspect2, 0.42)))
    y1: round((1688 - (2 * (lab + bar + room) + gap)) / 2) + lab + bar
    y2: y1 + room + gap + lab + bar
  screen: {x: 40, y: y1, w: 1000, h: y2 + room - y1}
  panes:
    - {x: round((1080 - w1) / 2), y: y1, w: w1, h: room}
    - {x: round((1080 - w2) / 2), y: y2, w: w2, h: room}
  caption: {x: 40, y: y2 + room + 12, w: 1000, h: 220}
  brandmark: {x: 700, y: 1840, w: 340, h: 40}
  radius: radius
# Square: side by side, narrow panes (a desktop page is reframed around what it acts on; a phone shows whole).
geometry_square:
  vars:
    bar: chrome * 40
    lab: labels * 44
    W: round((1080 - 80 - gap) / 2)
    h: 1080 - 30 - lab - bar - 12 - 160 - 50
    w1: min(W, round(h * aspect))
    w2: min(W, round(h * aspect2))
    top: 30 + lab + bar
  screen: {x: 40, y: top, w: 1000, h: h}
  panes:
    - {x: 40 + round((W - w1) / 2), y: top, w: w1, h: h}
    - {x: 40 + W + gap + round((W - w2) / 2), y: top, w: w2, h: h}
  caption: {x: 40, y: top + h + 12, w: 1000, h: 160}
  brandmark: {x: 700, y: 1010, w: 340, h: 40}
  radius: radius
variants: [landscape, vertical, square]
preview:
  at: [1]
  screens: [desktop, desktop]
