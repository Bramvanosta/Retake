# yaml-language-server: $schema=../../../schema/component.schema.json
# Reference look (docs/reference/look.md, "Clip layout"): the capture in a rounded card with a soft shadow on the
# theme background, the caption area below it, the brand mark (drawn by the composition) right-aligned with the card.
# The geometry follows the params: `width` sizes the card (its height follows the capture's aspect, at most 878), the
# card + caption block is centred vertically, and the caption and brand mark rects move with the card. At the default
# width and a 16:9 capture: card {180, 40, 1560 × 878}, caption {180, 930, 1220 × 110}, brand mark {1420, 965, 320 × 40}.
id: studio/layout-card
version: 1.0.0
kind: layout
name: Card
description: The capture in a rounded card with a soft shadow on the theme background, the caption area below, the brand mark right-aligned with the card.
tags: [card, reference-look]
slots:
  screen: {type: screen, required: true, description: The capture (video + camera moves).}
params:
  type: object
  properties:
    width: {type: number, minimum: 400, maximum: 1920, default: 1560, description: "Card width in design px (landscape; centred). Its height follows the capture aspect, at most 878 px so the caption block fits below: wider cards on 16:9 captures are capped at 1560."}
    radius: {type: number, minimum: 0, maximum: 64, default: 18, description: Corner radius of the card in design px.}
    shadow: {type: string, enum: [none, soft, strong], default: soft, description: "Shadow under the card (tinted with the theme's dark tone)."}
tokens: [colors.text, colors.paper, colors.dark, background]
geometry:
  vars:
    h: min(round(width / aspect), 878)          # card height: the capture's aspect, the caption block must fit below
    w: min(width, floor(878 * aspect))
    x: round((1920 - w) / 2)
    y: round((958 - h) / 2)                     # card + 12 px gap + 110 px caption block, centred (y 40 at h 878)
  screen: {x: x, y: y, w: w, h: h}
  frame: {x: x, y: y, w: w, h: h}             # the card (whole px); the capture is fitted inside
  caption: {x: x, y: y + h + 12, w: w - 340, h: 110}
  brandmark: {x: x + w - 320, y: y + h + 47, w: 320, h: 40}
  radius: radius
# Vertical and square: the card is as tall as the format allows and a capture wider than the card (a desktop page) is
# REFRAMED — the planner shows the region of the capture with the card's aspect, following the cursor and the targets
# (4:5 in vertical, ≈ 4:3 in square); a narrower capture (a phone) is shown whole.
geometry_vertical:
  vars:
    a: min(aspect, 0.8)                         # wider captures are reframed to 4:5
    h: min(round(1000 / a), 1240)
    w: min(1000, round(1240 * a))
    x: round((1080 - w) / 2)
    y: round((1688 - h) / 2)                    # card + 12 + 220 caption block, centred above the brand mark
  screen: {x: x, y: y, w: w, h: h}
  frame: {x: x, y: y, w: w, h: h}
  caption: {x: 40, y: y + h + 12, w: 1000, h: 220}
  brandmark: {x: 700, y: 1840, w: 340, h: 40}
  radius: radius
geometry_square:
  vars:
    a: min(aspect, 1.32)                        # wider captures are reframed to ≈ 4:3
    h: min(round(1000 / a), 760)
    w: min(1000, round(760 * a))
    x: round((1080 - w) / 2)
    y: round((1000 - h - 172) / 2)              # card + 12 + 160 caption block, centred above the brand mark
  screen: {x: x, y: y, w: w, h: h}
  frame: {x: x, y: y, w: w, h: h}
  caption: {x: 40, y: y + h + 12, w: 1000, h: 160}
  brandmark: {x: 700, y: 1010, w: 340, h: 40}
  radius: radius
variants: [landscape, vertical, square]
preview:
  at: [1]
