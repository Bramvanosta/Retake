# yaml-language-server: $schema=../../../schema/component.schema.json
# PLACEHOLDER (L2.4): theme-driven stand-in until the reference-look version lands in L2.5.
# The active cue in the layout's caption area (props.area): an accent rule and the uppercase kicker over one display
# line, styled by the theme's caption text styles. At a cue change the old line fades out and the new one rises in.
id: studio/caption-below
version: 0.1.0
kind: caption
name: Caption below
description: Accent rule and uppercase kicker over a display line in the layout's caption area; the old line fades out and the new one rises in at each cue change.
tags: [placeholder, caption, reference-look]
slots:
  text: {type: text, default_from: scene.caption.text, max_chars: 90, description: Caption line (when no cues are given).}
  kicker: {type: text, default_from: scene.caption.kicker, max_chars: 40, description: Small line above the caption.}
params:
  type: object
  properties:
    position: {type: string, enum: [below, above], default: below, description: "below: the layout's caption area; above: a band at the top of the frame."}
    align: {type: string, enum: [left, center], default: left, description: Alignment in the caption area.}
    max_lines: {type: integer, minimum: 1, maximum: 3, default: 1, description: Lines before the text shrinks.}
    rule: {type: boolean, default: true, description: Short accent rule before the kicker.}
tokens: [colors.accent, colors.text, colors.paper, fonts.display, fonts.body, captions.kicker, captions.line]
variants: [landscape, vertical]
preview:
  slots: {text: Pick a customer and the price list follows., kicker: Quotes}
  at: [0.6]
