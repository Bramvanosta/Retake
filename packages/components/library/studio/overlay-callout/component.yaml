# yaml-language-server: $schema=../../../schema/component.schema.json
# PLACEHOLDER (L2.4): theme-driven stand-in until the full version lands in L2.7.
# A callout pill with a pointer above or below the step target (props.anchor, output px); without an anchor it sits
# bottom-left like a lower third. Pops in, fades out at the end.
id: studio/overlay-callout
version: 0.1.0
kind: overlay
name: Callout
description: Dark callout pill with a pointer above or below the step target (a lower third without a target); pops in and fades out.
tags: [placeholder, overlay, callout]
slots:
  text: {type: text, required: true, max_chars: 60, description: The callout text.}
  kicker: {type: text, max_chars: 30, description: Small uppercase line before the text.}
params:
  type: object
  properties:
    placement: {type: string, enum: [auto, above, below], default: auto, description: Side of the target (auto = above when there is room).}
    max_width: {type: number, minimum: 200, maximum: 1200, default: 560, description: Widest pill in design px.}
tokens: [colors.accent, colors.text, colors.paper, fonts.body]
duration: {default: 2.5, min: 0.8, max: 30}
variants: [landscape, vertical]
preview:
  slots: {text: Totals update as you type, kicker: Live}
  at: [0.8]
