# yaml-language-server: $schema=../../../schema/component.schema.json
# PLACEHOLDER (L2.4): theme-driven stand-in until the full version lands in L2.7.
# A phone mock-up for narrow (mobile) captures: rounded dark body, the capture on its screen (a wide capture is
# letterboxed). The geometry below is what the planner and the review use: keep index.tsx in sync.
id: studio/layout-phone
version: 0.1.0
kind: layout
name: Phone
description: The capture on the screen of a phone mock-up (rounded dark body), for narrow mobile captures, caption area below.
tags: [placeholder, device, phone, mobile]
slots:
  screen: {type: screen, required: true, description: The capture (video + camera moves).}
params:
  type: object
  properties:
    body: {type: string, enum: [dark, light], default: dark, description: Colour of the phone body.}
tokens: [colors.text, colors.paper, background]
