# yaml-language-server: $schema=../../../schema/component.schema.json
# A macOS-style browser window around the capture, in the family of the reference card (docs/reference/look.md): the
# window (chrome bar + page) on the theme background with the reference soft shadow, the caption area below it and the
# brand mark (drawn by the composition) right-aligned with the window. The address bar shows the REAL page URL of the
# clip (ClipSegment.urls: it changes with navigation); `tabs` adds a tab strip above the toolbar.
# Geometry follows the params and the capture: `width` sizes the window, the page area keeps the capture's aspect
# (at most 878 − bar px tall so the caption block fits), window + 12 px + caption block centred vertically. At the
# default width and a 16:9 capture: window {226, 40, 1468 × 878} (bar 52), caption {226, 930, 1128 × 110}.
id: studio/layout-browser
version: 1.0.0
kind: layout
name: Browser window
description: The capture in a macOS-style browser window (traffic lights, optional tabs, an address bar with the real page URL) on the theme background, caption area below, brand mark right-aligned with the window.
tags: [browser, window, chrome, url]
slots:
  screen: {type: screen, required: true, description: The capture (video + camera moves).}
params:
  type: object
  properties:
    width: {type: number, minimum: 600, maximum: 1920, default: 1560, description: "Window width in design px (landscape; centred). The page area keeps the capture's aspect, at most 878 px minus the chrome tall: wider windows on 16:9 captures are capped."}
    radius: {type: number, minimum: 0, maximum: 40, default: 12, description: Corner radius of the window in design px.}
    shadow: {type: string, enum: [none, soft, strong], default: soft, description: "Shadow under the window (tinted with the theme's dark tone)."}
    show_url: {type: boolean, default: true, description: Show the page URL in the address bar.}
    tabs: {type: boolean, default: false, description: "Add a tab strip (one tab named after the page's host) above the toolbar."}
    chrome: {type: string, enum: [auto, light, dark], default: auto, description: "Toolbar tone: auto = dark on a dark theme background, light otherwise."}
    controls: {type: string, enum: [color, theme], default: color, description: "Window controls: the classic red / yellow / green, or quiet dots tinted from the theme."}
tokens: [colors.text, colors.paper, colors.dark, colors.accent, background, fonts.body]
geometry:
  vars:
    bar: 52 + 34 * tabs                         # chrome: toolbar 52, + a 34 px tab strip
    maxh: 878 - bar                             # window ≤ 878 tall: the caption block fits below
    h: min(round(width / aspect), maxh)         # the page area keeps the capture's aspect
    w: min(width, round(maxh * aspect))
    x: round((1920 - w) / 2)
    y: round((958 - bar - h) / 2)               # window + 12 + 110 caption block, centred
    cw: max(w - 340, 640)
    cx: min(x, round((1920 - cw) / 2))
  frame: {x: x, y: y, w: w, h: bar + h}
  chrome: {x: x, y: y, w: w, h: bar}
  screen: {x: x, y: y + bar, w: w, h: h}
  caption: {x: cx, y: y + bar + h + 12, w: cw, h: 110}
  brandmark: {x: "max(x + w - 320, cx + cw + 20)", y: y + bar + h + 47, w: 320, h: 40}
  radius: radius
geometry_vertical:
  vars:
    bar: 52 + 34 * tabs
    h: min(round(1000 / aspect), 1100)
    w: min(1000, round(1100 * aspect))
    x: round((1080 - w) / 2)
    y: round((1688 - bar - h) / 2)
  frame: {x: x, y: y, w: w, h: bar + h}
  chrome: {x: x, y: y, w: w, h: bar}
  screen: {x: x, y: y + bar, w: w, h: h}
  caption: {x: 40, y: y + bar + h + 12, w: 1000, h: 220}
  brandmark: {x: 700, y: 1840, w: 340, h: 40}
  radius: radius
variants: [landscape, vertical]
preview:
  at: [1]
