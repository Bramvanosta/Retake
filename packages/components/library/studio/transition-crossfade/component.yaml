# yaml-language-server: $schema=../../../schema/component.schema.json
# Reference look (docs/reference/look.md: 0.35 s crossfade between scenes). The composition renders the component
# twice over the overlap — around the outgoing segment (direction: exiting, which holds its last frame) and around the
# incoming one (direction: entering, drawn on top, fading in with an ease-in-out); the planner reads its length from
# `duration`. style_bias balanced / motion add a 1–2 % scale settle.
id: studio/transition-crossfade
version: 1.0.0
kind: transition
name: Crossfade
description: The incoming segment fades in over the outgoing one (which holds its last frame), ease-in-out; a hint of scale with livelier themes.
tags: [transition, crossfade, reference-look]
slots:
  screen: {type: screen, required: true, description: The segment this render wraps.}
params:
  type: object
  properties:
    duration: {type: number, minimum: 0, maximum: 3, default: 0.35, description: Length of the crossfade in seconds.}
tokens: [style_bias]
duration: {default: 0.35, min: 0.1, max: 3}
variants: [landscape, vertical]
preview:
  at: [0.17]
