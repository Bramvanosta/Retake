# yaml-language-server: $schema=../../../schema/component.schema.json
# Reference look (docs/reference/look.md, "Interstitial"): from the last frame of the previous clip, a warm night
# veil (the theme's `colors.dark`, else its dark text colour) fades in over 0.6 s (gently at first) to a full dark
# card; a 100 px clock (centre y ≈ 480) whose minute hand sweeps about one turn (eased) and the text (display 72 px,
# paper colour, y ≈ 612) fade in on top; the next clip crossfades in.
id: studio/interstitial-clock
version: 1.0.0
kind: interstitial
name: Interstitial clock
description: The last frame dims under a warm night veil into a dark card; a clock whose minute hand sweeps about one turn and the text fade in, centred.
tags: [interstitial, clock, reference-look]
slots:
  text: {type: text, required: true, default_from: interstitial.text, max_chars: 50, description: What happens meanwhile ("Two days later").}
  kicker: {type: text, default_from: interstitial.kicker, max_chars: 40, description: Small uppercase line above the clock.}
  screen: {type: screen, description: "The last frame of the previous clip, drawn dimmed under the card."}
params:
  type: object
  properties:
    dim: {type: number, minimum: 0, maximum: 1, default: 1, description: "Final opacity of the night veil over the last frame (1 = a full dark card, as in the reference)."}
    turns: {type: number, minimum: 0, maximum: 3, default: 1, description: Turns of the minute hand during the card.}
tokens: [colors.accent, colors.text, colors.paper, colors.dark, fonts.display, fonts.body, style_bias]
duration: {default: 2.6, min: 1, max: 8}
variants: [landscape, vertical]
preview:
  slots: {text: A few hours later}
  at: [0.3, 1.4]
