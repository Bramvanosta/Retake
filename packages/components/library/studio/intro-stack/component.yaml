# yaml-language-server: $schema=../../../schema/component.schema.json
# PLACEHOLDER (L2.4): theme-driven stand-in until the reference-look version lands in L2.5.
# Logo + wordmark row, kicker, display title and an accent rule drawn from the centre, rising in one after the other on
# the theme background. Every colour, font and the logo come from the theme; sizes are 1920-wide design px (× unit).
id: studio/intro-stack
version: 0.1.0
kind: intro
name: Intro stack
description: Logo and wordmark, uppercase kicker, display title and an accent rule, rising in one after the other on the theme background.
tags: [placeholder, intro, reference-look]
slots:
  title: {type: text, required: true, default_from: scenario.title.text, max_chars: 60, description: The video title.}
  kicker: {type: text, default_from: scenario.title.kicker, max_chars: 40, description: Small uppercase line above the title.}
  logo: {type: image, default_from: theme.logo, description: Logo image (the theme logo by default).}
params:
  type: object
  properties:
    align: {type: string, enum: [center, left], default: center, description: Alignment of the column.}
    rule: {type: boolean, default: true, description: Draw the accent rule under the title.}
    stagger: {type: number, minimum: 0, maximum: 0.5, default: 0.15, description: Seconds between the entrances of two lines.}
tokens: [colors.accent, colors.text, background, fonts.display, fonts.body, logo, wordmark]
duration: {default: 3.2, min: 1.5, max: 8}
variants: [landscape, vertical]
preview:
  slots: {title: Quotes in two clicks, kicker: Product tour}
  at: [0.3, 1.2, 2.8]
