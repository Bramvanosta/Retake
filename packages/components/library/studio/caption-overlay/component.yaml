# yaml-language-server: $schema=../../../schema/component.schema.json
# PLACEHOLDER (L2.4): theme-driven stand-in until the full version lands in L2.7.
# The active cue on a translucent dark band: over the capture near the bottom of the frame (layouts without a caption
# area, e.g. raw), or in the layout's caption area when it has one.
id: studio/caption-overlay
version: 0.1.0
kind: caption
name: Caption band
description: The active cue (kicker and line) on a translucent dark band near the bottom of the frame, over the capture; for raw and motion-style edits.
tags: [placeholder, caption, overlay, band]
slots:
  text: {type: text, default_from: scene.caption.text, max_chars: 90, description: Caption line (when no cues are given).}
  kicker: {type: text, default_from: scene.caption.kicker, max_chars: 40, description: Small line above the caption.}
params:
  type: object
  properties:
    opacity: {type: number, minimum: 0.3, maximum: 1, default: 0.82, description: Opacity of the band.}
    max_width: {type: number, minimum: 400, maximum: 1800, default: 1400, description: Widest band in design px.}
tokens: [colors.accent, colors.text, colors.paper, fonts.display, fonts.body, captions.kicker, captions.line]
variants: [landscape, vertical]
preview:
  slots: {text: Pick a customer and the price list follows., kicker: Quotes}
  at: [0.6]
