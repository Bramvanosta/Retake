# yaml-language-server: $schema=../../packages/core/schema/template.schema.json
# Demo Studio starter template "default": neutral and elegant.
# Inter throughout, slate text, a calm blue accent on a solid light background.
# Placeholder brand: "Demo Studio" (logo.svg, wordmark.svg) — replace it with yours (see README.md).
name: default

colors:
  accent: "#3b5ec9"   # calm blue: kicker, rules, cursor ripple
  text: "#1d2533"     # slate ink: titles and caption lines
  muted: "#5d6878"    # taglines, secondary text
  paper: "#f6f7f9"    # light surface; text colour on dark interstitials

fonts:
  display: fonts/Inter-SemiBold.ttf
  body: [fonts/Inter-Regular.ttf, fonts/Inter-SemiBold.ttf, fonts/Inter-Bold.ttf]

logo: logo.svg
wordmark: wordmark.svg

background: {type: solid, color: "#eef1f5"}

frame: {style: card, width: 1560, radius: 18, shadow: soft}

captions:
  position: below
  kicker: {font: body, weight: 600, size: 15, uppercase: true, color: accent, letter_spacing: 0.12}
  line: {font: display, size: 35, color: text, letter_spacing: -0.01}

intro: {duration: 3.2, layout: logo-kicker-title}
outro: {duration: 3.0, layout: logo-tagline}
interstitial: {style: dark, duration: 2.6}
transitions: {between_scenes: crossfade, duration: 0.35}

cursor: {style: arrow-dark, ripple_color: "rgba(59, 94, 201, 0.45)"}

motion: {default_zoom: none, max_zoom: 1.4, zoom_ease: [0.45, 0, 0.2, 1]}
style_bias: real

brandmark: {position: bottom-right, size: 30}
